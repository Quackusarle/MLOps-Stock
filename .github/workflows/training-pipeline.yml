name: "2. Model Training Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'kfp_pipeline.py'
      - 'run_pipeline.py'
      - 'Dockerfile.training'
      - 'requirements.txt'
  workflow_run:
    workflows: ["1. Data Ingestion & Versioning"]
    types:
      - completed
  workflow_dispatch:

env:
  IMAGE_NAME: mlops-stock-trainer

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  security-checks:
    name: Run Security Gate
    uses: ./.github/workflows/security-gate.yml
    secrets: inherit

  build-and-push:
    name: Build & Push Trainer Image
    needs: security-checks
    runs-on: [self-hosted, k3s, mlops]
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (remote BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.actions-runner-system.svc.cluster.local:1234

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          SHA_TAG="${IMAGE}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          LATEST_TAG="${IMAGE}:latest"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Will build: ${LATEST_TAG} and ${SHA_TAG}"

      - name: Set up Python for DVC
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: 'pip'
          cache-dependency-path: '.github/requirements.txt'

      - name: DVC Pull Data
        run: |
          pip install -r .github/requirements.txt
          dvc pull || echo "No DVC data to pull yet"
          mkdir -p data

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.training
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.latest_tag }}
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-cache:trainer
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-cache:trainer,mode=min

      # ── Trivy Container Scan ────────────────────────────────────────────
      # Quét training image tìm CVE. Image này chứa nhiều thư viện ML
      # (torch, lightgbm, scipy) nên khả năng có CVE cao.
      - name: "Trivy Image Scan - Trainer"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: "Trivy SARIF Report - Trainer"
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: 'sarif'
          output: 'trivy-trainer.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-trainer.sarif'
          category: 'trivy-trainer'

      - name: Push Docker Image
        run: |
          docker push ${{ steps.meta.outputs.latest_tag }}
          docker push ${{ steps.meta.outputs.sha_tag }}

      # ── Cosign Image Signing ────────────────────────────────────────────
      - name: "Install Cosign"
        uses: sigstore/cosign-installer@v3

      - name: "Sign Trainer Image"
        run: |
          cosign sign --yes ${{ steps.meta.outputs.sha_tag }}
          cosign sign --yes ${{ steps.meta.outputs.latest_tag }}
          echo "Trainer image signed successfully"

      - name: Set trainer image env for next step
        run: echo "TRAINER_IMAGE=${{ steps.meta.outputs.latest_tag }}" >> $GITHUB_ENV

  submit-kubeflow-pipeline:
    name: Compile & Submit Kubeflow Pipeline
    runs-on: [self-hosted, k3s, mlops]
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: 'pip'
          cache-dependency-path: '.github/requirements.txt'

      - name: Install KFP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      - name: Compile & Submit Kubeflow Pipeline
        env:
          KFP_HOST: "http://ml-pipeline.kubeflow.svc.cluster.local:8888"
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          export TRAINER_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/mlops-stock-trainer:sha-${SHA_SHORT}"
          python run_pipeline.py

      - name: "Training Pipeline Summary"
        run: |
          echo "## Training Pipeline - Security Report" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Scan | No CRITICAL CVEs |" >> $GITHUB_STEP_SUMMARY
          echo "| Cosign Sign | Image Signed |" >> $GITHUB_STEP_SUMMARY
          echo "| KFP Submit | Pipeline Submitted |" >> $GITHUB_STEP_SUMMARY

