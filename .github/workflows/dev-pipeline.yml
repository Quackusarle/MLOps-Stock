name: "Dev Branch - Full Analysis"

on:
  push:
    branches:
      - dev

concurrency:
  group: dev-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-checks:
    name: "Run Security Checks"
    uses: ./.github/workflows/security-checks.yml
    secrets: inherit

  sonarqube-analysis:
    name: "SonarQube Scan"
    needs: security-checks
    runs-on: [self-hosted, k3s, mlops]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Cache SonarScanner
        id: cache-sonar
        uses: actions/cache@v4
        with:
          path: sonar-scanner-5.0.1.3006-linux
          key: ${{ runner.os }}-sonar-scanner-5.0.1.3006

      - name: Install and Run SonarQube Scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: 'http://sonarqube-sonarqube.mlops-infra.svc.cluster.local:9000'
        run: |
          if [ ! -d "sonar-scanner-5.0.1.3006-linux" ]; then
            echo "Downloading SonarScanner CLI..."
            curl -sL https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip -o sonar-scanner.zip
            unzip -q sonar-scanner.zip
          else
            echo "Using cached SonarScanner CLI..."
          fi
          export PATH=$PATH:$PWD/sonar-scanner-5.0.1.3006-linux/bin
          
          echo "Running SonarScanner..."
          sonar-scanner \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.login="${SONAR_TOKEN}"

      - name: Post Summary
        run: |
          echo "## Dev Branch Analysis" >> $GITHUB_STEP_SUMMARY
          echo "SonarQube scan completed." >> $GITHUB_STEP_SUMMARY
