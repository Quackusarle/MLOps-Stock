name: "Dev Branch - SonarQube Analysis"

on:
  push:
    branches:
      - dev

concurrency:
  group: dev-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube-analysis:
    name: "Unit Tests & SonarQube"
    runs-on: [self-hosted, k3s, mlops]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube cần full history để phân tích tốt hơn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run Tests with Coverage
        run: |
          echo "Running Unit Tests"
          pytest tests/ \
            --cov=src \
            --cov=services \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v || echo "Tests failed but continuing to SonarQube..."

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Post Coverage Summary
        run: |
          echo "## Dev Branch Analysis" >> $GITHUB_STEP_SUMMARY
          echo "SonarQube scan completed. Please check your SonarQube server for the full report." >> $GITHUB_STEP_SUMMARY
