name: "6. Promote Dev Images to Prod"

on:
  push:
    branches: [main]

concurrency:
  group: promote-to-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promote:
    name: Copy Stable Dev Image Tags to Prod
    runs-on: [self-hosted, k3s, mlops]

    steps:
      - name: Checkout Manifest Repo
        uses: actions/checkout@v4
        with:
          repository: Quackusarle/NT114_manifests
          token: ${{ secrets.MANIFEST_REPO_PAT }}
          path: manifests
          ref: main

      - name: Promote values-dev.yaml tags to values-prod.yaml
        run: |
          cd manifests/argocd/apps/mlops-stock

          if [ ! -f values-dev.yaml ] || [ ! -f values-prod.yaml ]; then
            echo "values-dev.yaml or values-prod.yaml is missing"
            exit 1
          fi

          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /tmp/yq
          chmod +x /tmp/yq

          for service in dataApi tftApi lgbmApi ensembleApi dashboardUi; do
            TAG=$(/tmp/yq ".${service}.image.tag" values-dev.yaml)
            if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
              echo "Missing dev tag for ${service}"
              exit 1
            fi
            /tmp/yq -i ".${service}.image.tag = \"${TAG}\"" values-prod.yaml
            echo "Promoted ${service} -> ${TAG}"
          done

          git diff -- values-prod.yaml

      - name: Commit and Push Promotion
        run: |
          cd manifests
          git config user.name "GitHub Actions GitOps"
          git config user.email "actions@github.com"
          git add argocd/apps/mlops-stock/values-prod.yaml

          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: promote dev image tags to prod [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Prod values already match dev tags"
          fi

      - name: Job Summary
        run: |
          echo "## Promote to Prod" >> $GITHUB_STEP_SUMMARY
          echo "Copied stable image tags from values-dev.yaml to values-prod.yaml." >> $GITHUB_STEP_SUMMARY
