name: "4. Model Services Pipeline"

on:
  push:
    branches: [main]
    paths: ['services/lgbm_api/**', 'services/tft_api/**', 'services/ensemble_api/**', 'services/data_api/**', 'src/**', 'requirements.txt']
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (empty = build all)'
        required: false
        type: choice
        options: ['', lgbm_api, tft_api, ensemble_api, data_api]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  security-checks:
    name: Run Security Gate
    uses: ./.github/workflows/security-checks.yml
    secrets: inherit

  detect-changes:
    name: Detect Changed Services
    needs: security-checks
    runs-on: [self-hosted, k3s, mlops]
    outputs:
      lgbm_api: ${{ steps.filter.outputs.lgbm_api }}
      tft_api: ${{ steps.filter.outputs.tft_api }}
      ensemble_api: ${{ steps.filter.outputs.ensemble_api }}
      data_api: ${{ steps.filter.outputs.data_api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lgbm_api:
              - 'services/lgbm_api/**'
              - 'src/**'
              - 'requirements.txt'
            tft_api:
              - 'services/tft_api/**'
              - 'src/**'
              - 'requirements.txt'
            ensemble_api:
              - 'services/ensemble_api/**'
              - 'src/**'
              - 'requirements.txt'
            data_api:
              - 'services/data_api/**'
              - 'src/**'
              - 'requirements.txt'

  build-scan-push:
    name: Build -> Scan -> Push -> Sign ${{ matrix.service }}
    runs-on: [self-hosted, k3s, mlops]
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: lgbm_api
            image_suffix: lgbm-api
            should_build: ${{ needs.detect-changes.outputs.lgbm_api == 'true' || github.event.inputs.service == 'lgbm_api' || github.event.inputs.service == '' && github.event_name == 'workflow_dispatch' }}
          - service: tft_api
            image_suffix: tft-api
            should_build: ${{ needs.detect-changes.outputs.tft_api == 'true' || github.event.inputs.service == 'tft_api' || github.event.inputs.service == '' && github.event_name == 'workflow_dispatch' }}
          - service: ensemble_api
            image_suffix: ensemble-api
            should_build: ${{ needs.detect-changes.outputs.ensemble_api == 'true' || github.event.inputs.service == 'ensemble_api' || github.event.inputs.service == '' && github.event_name == 'workflow_dispatch' }}
          - service: data_api
            image_suffix: data-api
            should_build: ${{ needs.detect-changes.outputs.data_api == 'true' || github.event.inputs.service == 'data_api' || github.event.inputs.service == '' && github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Skip check
        if: ${{ matrix.should_build != 'true' }}
        run: echo "Skipping ${{ matrix.service }} - no changes detected"

      - name: Checkout Code
        if: ${{ matrix.should_build == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ matrix.should_build == 'true' }}
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.actions-runner-system.svc.cluster.local:1234

      - name: Login to Docker Hub
        if: ${{ matrix.should_build == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags
        if: ${{ matrix.should_build == 'true' }}
        id: meta
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/mlops-stock-${{ matrix.image_suffix }}"
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "sha_tag=${IMAGE}:sha-${SHA_SHORT}" >> $GITHUB_OUTPUT

      # Step 1: Build va xuat thanh tar tai runner
      - name: Build ${{ matrix.service }} (export to tar)
        if: ${{ matrix.should_build == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
          tags: ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-cache:${{ matrix.service }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/mlops-cache:${{ matrix.service }},mode=min

      # Step 2: Trivy quet file tar tai local
      - name: Trivy Image Scan - ${{ matrix.service }}
        if: ${{ matrix.should_build == 'true' }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: '/tmp/${{ matrix.service }}.tar'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Trivy SARIF Report - ${{ matrix.service }}
        if: ${{ matrix.should_build == 'true' && always() }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: '/tmp/${{ matrix.service }}.tar'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF
        if: ${{ matrix.should_build == 'true' && always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

      # Step 3: Scan pass -> crane push len registry
      - name: Install crane
        if: ${{ matrix.should_build == 'true' }}
        uses: imjasonh/setup-crane@v0.4

      - name: Push with crane
        if: ${{ matrix.should_build == 'true' }}
        run: |
          crane auth login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }} index.docker.io
          crane push /tmp/${{ matrix.service }}.tar ${{ steps.meta.outputs.sha_tag }}
          crane tag ${{ steps.meta.outputs.sha_tag }} latest

      # Step 4: Cosign sign
      - name: Install Cosign
        if: ${{ matrix.should_build == 'true' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign ${{ matrix.service }} image
        if: ${{ matrix.should_build == 'true' }}
        run: |
          cosign sign --yes ${{ steps.meta.outputs.sha_tag }}
          cosign sign --yes ${{ steps.meta.outputs.image }}:latest

      - name: Cleanup
        if: always()
        run: rm -f /tmp/${{ matrix.service }}.tar
